# Continuous integration for both applications (docs/PROGRESS.md "CI").
# Backend: compile, unit tests (including ArchUnit module boundaries) and the
# cross-tenant isolation integration tests. Flutter: analyzer + widget tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 21, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: schoolsphere
          POSTGRES_PASSWORD: schoolsphere_dev
          POSTGRES_DB: schoolsphere
          # Listen on 5433 inside the container so the 5433:5433 mapping and the dev-profile URL agree.
          PGPORT: 5433
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -U schoolsphere -d schoolsphere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run unit tests
        run: mvn -B -Dmaven.repo.local=${{ github.workspace }}/m2repo test
        working-directory: backend

      - name: Provision the application role
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5433 -U schoolsphere -d schoolsphere -f deploy/scripts/provision-db.sql
        env:
          PGPASSWORD: schoolsphere_dev

      - name: Run integration tests (cross-tenant isolation)
        run: mvn -B -Dmaven.repo.local=${{ github.workspace }}/m2repo failsafe:integration-test failsafe:verify
        working-directory: backend

  flutter:
    name: flutter (analyzer + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze --no-pub
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app
