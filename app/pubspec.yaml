name: schoolsphere_app
description: "Trixx Education — multi-school management and learning platform (Flutter client)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.0
  intl: any
  url_launcher: ^6.3.1
  file_saver: ^0.2.14
  connectivity_plus: ^6.1.0
  go_router: ^18.1.0
  flutter_svg: ^2.3.0
  # Real-time chat (STOMP over WebSocket). The backend exposes /ws with the
  # Spring simple broker; the client speaks STOMP 1.2 over this transport.
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons are generated from the brand assets, never hand-edited:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: assets/brand/trixx-app-icon-1024.png
    background_color: "#F5F7FB"
    theme_color: "#087F73"
  image_path: assets/brand/trixx-app-icon-1024.png
  adaptive_icon_background: "#F5F7FB"
  adaptive_icon_foreground: assets/brand/trixx-mark-1024.png
  adaptive_icon_monochrome: assets/brand/trixx-mark-mono-1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
