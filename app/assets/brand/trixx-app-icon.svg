<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Trixx Education">
  <title>Trixx Education app icon</title>
  <!-- Full-bleed square for launcher-icon generation. Stores and operating systems apply their
       own corner masks, so there is no rounded rect here. The cap and layers sit inside the
       central 66% safe zone (16.32 .. 79.68) with navy as the background colour. -->
  <rect width="96" height="96" fill="#172B4D"/>
  <g transform="translate(16.32 16.32) scale(0.66)">
    <polygon points="48,19 80,36 48,53 16,36" fill="#FFFFFF"/>
    <line x1="48" y1="36" x2="72" y2="36" stroke="#E6A23C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="36" r="3" fill="#172B4D"/>
    <circle cx="73" cy="36" r="3.4" fill="#E6A23C"/>
    <polyline points="16,45.5 48,62.5 80,45.5" fill="none" stroke="#0F9F91" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="16,57.5 48,74.5 80,57.5" fill="none" stroke="#52D4C2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
