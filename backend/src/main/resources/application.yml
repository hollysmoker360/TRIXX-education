spring:
  main:
    allow-circular-references: true
  application:
    name: schoolsphere
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

schoolsphere:
  security:
    jwt:
      issuer: schoolsphere
      # Rotatable keys. The first entry is used for signing; all entries are accepted for verification.
      signing-keys:
        - kid: k-dev-1
          secret: ${SCHOOLSPHERE_JWT_SECRET:kZ8tR2xQ9mL4vN7pW1yA6cD3fG5jH0sB8eT2uI4oP6zX9qM1nV3bC5dF7gJ9kL0}
      access-ttl-minutes: 15
      refresh-ttl-days: 30
    cors:
      allowed-origins: ${SCHOOLSPHERE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    type: ${SCHOOLSPHERE_STORAGE_TYPE:local}
    local-root: ${SCHOOLSPHERE_STORAGE_ROOT:./data/storage}
  sync:
    pull-default-limit: 500
    pull-max-limit: 1000
    op-log-retention-days: 90

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs

logging:
  level:
    com.schoolsphere: INFO
    org.flywaydb: INFO
