# Local development stack (docs/OPERATIONS.md section 1). Runs the same backend artifact with the
# `dev` profile: PostgreSQL 18 on :5433, demo seeding enabled, local storage, billing off.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: schoolsphere
      POSTGRES_PASSWORD: schoolsphere_dev
      POSTGRES_DB: schoolsphere
      PGPORT: 5433
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolsphere -d schoolsphere"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../../backend
      dockerfile: ../../deploy/docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SCHOOLSPHERE_DB_URL: jdbc:postgresql://postgres:5433/schoolsphere
      SCHOOLSPHERE_DB_USER: schoolsphere_app
      SCHOOLSPHERE_DB_PASSWORD: schoolsphere_app_dev
      SCHOOLSPHERE_DB_OWNER: schoolsphere
      SCHOOLSPHERE_DB_OWNER_PASSWORD: schoolsphere_dev
      SCHOOLSPHERE_SEED_ENABLED: "true"
      SCHOOLSPHERE_STORAGE_TYPE: local
      SCHOOLSPHERE_STORAGE_ROOT: /data/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
